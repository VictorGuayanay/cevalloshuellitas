# openspec/config.yaml — Generated by sdd-init
# Describes the project context for SDD sub-agents

project:
  name: "aplicacion"  # pubspec package name; app title is "Huellitas" (lib/main.dart)
  description: >-
    Huellitas — Flutter mobile app for pet owners, veterinarians and producers
    (mascotas, servicios, mapa de veterinarios, noticias, notificaciones)
    backed by Supabase (Postgres, Edge Functions) and Firebase Cloud Messaging.

stack:
  languages:
    - "Dart"
    - "TypeScript"   # Supabase Edge Functions (Deno runtime)
    - "SQL"          # Supabase migrations
  frameworks:
    - "Flutter (Material, SDK ^3.8.0)"
    - "supabase_flutter ^2.9.0"
    - "provider ^6.1.0"
    - "firebase_core ^3.13.1 / firebase_messaging ^15.2.5"
    - "flutter_map ^7.0.2 + geolocator ^14.0.2"
    - "google_sign_in ^6.2.1"
  test_frameworks:
    - "flutter_test"  # unit + widget tests under test/ (only scaffold widget_test.dart exists today)
  build_tools:
    - "Flutter CLI (flutter build / flutter run / flutter pub get)"
    - "flutter_launcher_icons ^0.13.1"
    - "Supabase CLI"  # PROVISIONAL: supabase/migrations + supabase/functions layout detected, but no supabase/config.toml found

architecture:
  pattern: "layered (core / data / domain / presentation) with Provider state management"
  entry_points:
    - "lib/main.dart"
    - "supabase/functions/notify-mascota-perdida/index.ts"
    - "supabase/functions/notificar-adopcion/index.ts"

conventions:
  commit_style: "Conventional Commits (feat/fix/docs/test/chore/refactor…) — CONFIRMED by user"
  linting: "flutter_lints ^6.0.0 via analysis_options.yaml (flutter.yaml ruleset, no custom rules enabled)"
  formatting: "dart format (defaults; no custom configuration detected)"

# Project standards — CONFIRMED by user (2026-10-21)
standards:
  documented: false
  inference_source: "code"           # infer conventions from existing project code
  corporate_skills: true             # ALSO apply corporate skills: project-architecture, project-security, project-standards

# SDD behavior configuration
sdd:
  tdd: true                  # CONFIRMED by user: TDD enforced by default on all changes
  detail_level: standard     # concise | standard | deep

